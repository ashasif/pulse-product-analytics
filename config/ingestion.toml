# Pulse Phase 3 ingestion contract.
#
# This contract describes the formally approved Phase 2 raw CSV snapshot.
# Phase 3 must validate source files against this contract rather than
# inferring schemas dynamically from whatever files happen to be present.

[ingestion]
source_dir = "data/raw"
quarantine_dir = "data/quarantine"
encoding = "utf-8"
delimiter = ","
reject_unexpected_csv_files = true


[datasets.installations]
filename = "installations.csv"
expected_rows = 100000
columns = [
    "installation_id",
    "anonymous_id",
    "installed_at",
    "platform",
    "acquisition_channel",
    "country_code",
]


